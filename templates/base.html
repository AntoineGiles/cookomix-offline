<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cookomix Offline</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f4f5f7;
            color: #222;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .home-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .home-header svg {
            display: block;
            margin: 0 auto 10px auto;
        }

        .home-header h1 {
            margin: 0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            margin: 12px 0;
        }

        button {
            background: #32865c;
            color: white;
            padding: 12px 20px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }

        .success { background: #dff5e5; padding: 12px; border-radius: 7px; }
        .error { background: #ffe1e1; padding: 12px; border-radius: 7px; }

        a { color: #32865c; }
    </style>
</head>

<body>
    {% block content %}{% endblock %}
</body>
</html>
